# Rebuilds the 3D contribution city for every README theme, daily.
# Output lands on the `output` branch; the READMEs read it from there.
name: activity-art

on:
  schedule:
    - cron: "0 3 * * *"   # every day, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/activity.yml", "scripts/activity3d.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 3D contribution city (all themes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity3d.py --user "${{ github.repository_owner }}" --out dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh activity art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
